<style>

  .lang{position:absolute;right:0;top:0;display:flex;gap:6px}
  .lang button{
    background:none;border:1px solid var(--line);color:var(--dim);
    border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;
  }
  .lang button.on{color:#20180a;background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:transparent;font-weight:600}
  .mark{width:52px;height:52px;margin:6px auto 12px;display:block}
  h1{font:600 26px/1.3 ui-serif,Georgia,"Songti SC","Noto Serif CJK SC",serif;letter-spacing:.4px;margin:0 0 8px}
  h1 em{font-style:normal;color:var(--gold2)}
  h1 .en{display:block;font-size:14px;letter-spacing:2.4px;color:var(--dim);text-transform:uppercase;margin-top:6px;font-weight:400}
  .sub{color:var(--dim);font-size:14.5px;max-width:48ch;margin:0 auto}
  .panel{
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
    border:1px solid var(--line);border-radius:16px;padding:20px;margin:18px 0;
  }
  label{display:block;font-size:13px;color:var(--dim);margin-bottom:8px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  input[type=date]{
    flex:1 1 200px;background:var(--ink2);border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit;
  }
  input[type=date]:focus{outline:2px solid var(--gold);outline-offset:1px}
  button.act{
    background:linear-gradient(180deg,var(--gold2),var(--gold));color:#20180a;border:0;
    border-radius:10px;padding:11px 18px;font:600 14.5px/1 inherit;cursor:pointer;font-family:inherit;
  }
  button.ghost{background:none;border:1px solid var(--line);color:var(--txt);border-radius:10px;
    padding:10px 16px;font:500 14px/1 inherit;cursor:pointer;font-family:inherit}
  button:active{transform:translateY(1px)}
  .hint{font-size:12.5px;color:var(--dim);margin-top:9px}
  #out{display:none}
  #out.on{display:block;animation:fade .5s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .cardwrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap;justify-content:center}
  .sigil{width:150px;height:230px;flex:0 0 auto;border-radius:10px;
         border:1px solid var(--line);background:rgba(0,0,0,.25)}
  .sigil.rev{transform:rotate(180deg)}
  .meta{min-width:210px}
  .cardname{font:600 25px/1.3 ui-serif,Georgia,"Songti SC","Noto Serif CJK SC",serif;margin:2px 0 4px}

  .pos.rev{color:#e0a0a0}

  .tag.yours{color:var(--gold2)}
  .pos.natal{color:#9fc4e8;border-color:#2f3f58}
  details{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
  summary{cursor:pointer;color:var(--gold2);font-size:14px;font-weight:600;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary:before{content:"▸ ";}
  details[open] summary:before{content:"▾ ";}
  .steps{margin:14px 0 0;padding:0;list-style:none;font-size:14px}
  .steps li{padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.07);color:#d6d3c9}

  .note{font-size:12.5px;color:var(--dim);margin-top:12px}
  footer{text-align:center;color:var(--dim);font-size:12.5px;margin-top:40px;line-height:2}
  footer a{color:var(--dim)}
  .lock{text-align:center;color:var(--dim);font-size:12.5px;margin-top:16px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
         background:var(--gold);color:#20180a;font-weight:600;font-size:14px;
         padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.28s;z-index:99}
  .toast.on{opacity:1;transform:translateX(-50%)}

const R_EN = {
"Two of Wands":["A decision you have already made is still being treated as optional. The waiting is now the risk, not the choice.","Name the thing you are waiting for, out loud. If you cannot name it, you are not waiting — you are avoiding.","The urge to gather one more opinion before you move."],

"Three of Swords":["A hurt is specific and worth naming rather than working around. Clarity here hurts less than the vagueness does.","Say what actually happened, in plain words, to one person.","Being noble about it instead of accurate."],
"Four of Swords":["Rest is the productive move, not the reward for finishing. Recovery is part of the work, not a break from it.","Cancel one thing. Not everything — one.","Pushing through and calling it discipline."],

/* ══════════════════ 二、天文计算 · astronomy ══════════════════ */
const D2R=Math.PI/180;
const norm=a=>((a%360)+360)%360;

function julianDay(y,m,d){
  if(m<=2){y-=1;m+=12;}
  const A=Math.floor(y/100), B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5;
}
function sunLon(jd){
  const T=(jd-2451545)/36525;
  const L0=norm(280.46646+36000.76983*T+0.0003032*T*T);
  const M=norm(357.52911+35999.05029*T-0.0001537*T*T);
  const C=Math.sin(M*D2R)*(1.914602-0.004817*T-0.000014*T*T)
        + Math.sin(2*M*D2R)*(0.019993-0.000101*T)
        + Math.sin(3*M*D2R)*0.000289;
  return norm(L0+C-0.00569-0.00478*Math.sin((125.04-1934.136*T)*D2R));
}
function moonLon(jd){
  const T=(jd-2451545)/36525;
  const Lp=norm(218.3164477+481267.88123421*T-0.0015786*T*T+T*T*T/538841-T*T*T*T/65194000);
  const D =norm(297.8501921+445267.1114034*T-0.0018819*T*T+T*T*T/545868-T*T*T*T/113065000);
  const M =norm(357.5291092+35999.0502909*T-0.0001536*T*T+T*T*T/24490000);
  const Mp=norm(134.9633964+477198.8675055*T+0.0087414*T*T+T*T*T/69699-T*T*T*T/14712000);
  const F =norm(93.2720950+483202.0175233*T-0.0036539*T*T-T*T*T/3526000+T*T*T*T/863310000);
  const d=D*D2R,m=M*D2R,mp=Mp*D2R,f=F*D2R;
  const s = 6.288774*Math.sin(mp)+1.274027*Math.sin(2*d-mp)+0.658314*Math.sin(2*d)
        + 0.213618*Math.sin(2*mp)-0.185116*Math.sin(m)-0.114332*Math.sin(2*f)
        + 0.058793*Math.sin(2*d-2*mp)+0.057066*Math.sin(2*d-m-mp)+0.053322*Math.sin(2*d+mp)
        + 0.045758*Math.sin(2*d-m)-0.040923*Math.sin(m-mp)-0.034720*Math.sin(d)
        - 0.030383*Math.sin(m+mp)+0.015327*Math.sin(2*d-2*f)-0.012528*Math.sin(mp+2*f)
        + 0.010980*Math.sin(mp-2*f);
  return norm(Lp+s);
}
const SIGNS=["Aries","Taurus","Gemini","Cancer","Leo","Virgo",
             "Libra","Scorpio","Sagittarius","Capricorn","Aquarius","Pisces"];
function phaseIdx(elong){
  const e=norm(elong);
  if(e<22.5||e>=337.5) return 0;
  if(e<67.5) return 1; if(e<112.5) return 2; if(e<157.5) return 3;
  if(e<202.5) return 4; if(e<247.5) return 5; if(e<292.5) return 6;
  return 7;
}
const isWaxing=e=>norm(e)<180;

function birthArcana(iso){
  let n=iso.replace(/\D/g,"").split("").reduce((a,c)=>a+(+c),0);
  while(n>22) n=String(n).split("").reduce((a,c)=>a+(+c),0);
  return n===22 ? 0 : n;
}

/* ══════════════════ 三、生成式牌面 · generative sigil ══════════════════ */
const SUIT_COLOR={Wands:"#d2603a",Cups:"#3f7fa8",Swords:"#c9b25a",Pentacles:"#5f8a5a"};
const GLYPH={Sun:"☉",Moon:"☾",Mercury:"☿",Venus:"♀",Mars:"♂",Jupiter:"♃",Saturn:"♄"};
const NUMWORD={Two:2,Three:3,Four:4,Five:5,Six:6,Seven:7,Eight:8,Nine:9,Ten:10};

function sigil(cardEn, decanIndex, planet, reversed){
  const suit=cardEn.split(" ").pop();
  const pip =NUMWORD[cardEn.split(" ")[0]]||0;   // 牌的数字决定边数
  const c   =SUIT_COLOR[suit]||"#c8a24a";
  const W=150,H=230,cx=W/2,cy=H/2;
  let s=`<rect width="${W}" height="${H}" fill="#0b0d1a"/>`;
  s+=`<rect x="6" y="6" width="${W-12}" height="${H-12}" fill="none" stroke="${c}" stroke-width="1" opacity=".5" rx="6"/>`;
  s+=`<rect x="11" y="11" width="${W-22}" height="${H-22}" fill="none" stroke="${c}" stroke-width=".5" opacity=".3" rx="4"/>`;
  const r=52;
  for(let i=0;i<36;i++){
    const a=(-90+i*10)*D2R, on=(i===decanIndex);
    const r1=on?r-11:r-6, r2=r+6;
    s+=`<line x1="${cx+r1*Math.cos(a)}" y1="${cy+r1*Math.sin(a)}" x2="${cx+r2*Math.cos(a)}" y2="${cy+r2*Math.sin(a)}" stroke="${on?c:"#3a4166"}" stroke-width="${on?2.2:.9}" opacity="${on?1:.7}"/>`;
  }
  const n=Math.max(3,pip), R=30;
  let pts=[];
  for(let i=0;i<n;i++){
    const a=(-90+i*360/n+decanIndex*7)*D2R;
    pts.push(`${(cx+R*Math.cos(a)).toFixed(1)},${(cy+R*Math.sin(a)).toFixed(1)}`);
  }
  s+=`<polygon points="${pts.join(" ")}" fill="none" stroke="${c}" stroke-width="1.6" opacity=".95"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="7.5" fill="none" stroke="${c}" stroke-width="1.1" opacity=".85"/>`;
  s+=`<text x="${cx}" y="${cy+5.5}" text-anchor="middle" font-size="11" fill="${c}">${GLYPH[planet]||"✦"}</text>`;
  [[20,26],[W-20,26],[20,H-26],[W-20,H-26]].forEach(([x,y])=>{
    s+=`<circle cx="${x}" cy="${y}" r="2.1" fill="${c}" opacity=".55"/>`; });
  if(reversed) s+=`<text x="${W-16}" y="${H-14}" text-anchor="end" font-size="9" fill="#e0a0a0" opacity=".9">REV</text>`;
  return s;
}

// 出生那天月亮所在的旬 —— 由生日唯一确定，不随机
function birthDecan(iso){
  const [y,m,d]=iso.split("-").map(Number);
  const jd=julianDay(y,m,d)+0.5;          // 当天 12:00 UT
  const ml=norm(moonLon(jd));
  const di=Math.floor(ml/10);
  return { jd:jd, ml:ml, di:di, dec:DECANS[di] };
}

// 今日旬位与本命旬位的关系 —— 全部由已有属性推出，不掷骰子
function meetLine(dayDec, bDec){
  const t=T[LANG];
  if(dayDec.c===bDec.c) return t.meetCard;
  const ds=dayDec.c.split(" ").pop(), bs=bDec.c.split(" ").pop();
  if(ds===bs) return t.meetSuit.replace("{v}", LANG==="zh"?SUIT_ZH[ds]:ds);
  if(dayDec.p===bDec.p) return t.meetPlanet.replace("{v}", LANG==="zh"?(PLANET_ZH[dayDec.p]||dayDec.p):dayDec.p);
  const de=ELEMENT[ds], be=ELEMENT[bs];
  const D=LANG==="zh"?ELEM_ZH[de]:de, B=LANG==="zh"?ELEM_ZH[be]:be;
  if(de===be) return t.meetElem.replace("{v}", D);
  const sym=(de==="Fire"&&be==="Air")||(de==="Air"&&be==="Fire")||
            (de==="Water"&&be==="Earth")||(de==="Earth"&&be==="Water");
  const ant=(de==="Fire"&&be==="Water")||(de==="Water"&&be==="Fire")||
            (de==="Air"&&be==="Earth")||(de==="Earth"&&be==="Air");
  const tpl = sym?t.meetSym : ant?t.meetAnt : t.meetNeu;
  return tpl.replace("{d}",D).replace("{b}",B);
}

// 中英分别按字符 / 按词换行；draw===false 时只量不画
function wrapText(g, text, x, y, maxW, lh, draw){
  const paras=String(text||"").split("\n");
  for(let p=0;p<paras.length;p++){
    const units = LANG==="zh" ? paras[p].split("") : paras[p].split(" ");
    let line="";
    for(let i=0;i<units.length;i++){
      const test = (LANG==="zh" || !line) ? line+units[i] : line+" "+units[i];
      if(g.measureText(test).width > maxW && line){
        if(draw!==false) g.fillText(line, x, y);
        y+=lh; line = units[i];
      } else { line=test; }
    }
    if(line){ if(draw!==false) g.fillText(line, x, y); y+=lh; }
  }
  return y;
}

      ? 'px -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'
      : 'px -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
    const F=(tpl,px,wt)=>wt+" "+px+tpl;

    const blocks=[
      [t.t1, $("r1").textContent],
      [t.t2, $("r2").textContent],
      [t.t3, $("r3").textContent],
      [t.t4, $("r4").textContent],
      [t.t7, $("r7").textContent]
    ];

    // 只量不画：算排版需要多少高度
    const measure=function(g, S){
      let y=BLOCK_Y0;
      for(let i=0;i<blocks.length;i++){
        const fs=Math.round(29*S);
        y+=Math.round(36*S);
        g.font=F(sans, fs, "400");
        y=wrapText(g, blocks[i][1], PAD, y, W-PAD*2, Math.round(fs*1.42), false)+Math.round(18*S);
      }
      return y-Math.round(18*S);
    };

    const paint=function(imDay, imBirth){
      // ── 先在临时画布上量 ──
      const m=document.createElement("canvas"); m.width=W; m.height=10;
      const gm=m.getContext("2d");
      let S=1, H=1350;
      while(S>0.66 && measure(gm,S) > H-124) S-=0.03;
      const need=measure(gm,S);
      if(need > H-124) H=Math.round(need+124);

      // ── 正式绘制 ──
      const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
      const g=cv.getContext("2d");

      g.fillStyle="#0b0d1a"; g.fillRect(0,0,W,H);
      const rg=g.createRadialGradient(W*0.30,-H*0.05,60,W*0.30,-H*0.05,H*0.92);
      rg.addColorStop(0,"#232a58"); rg.addColorStop(1,"rgba(11,13,26,0)");
      g.fillStyle=rg; g.fillRect(0,0,W,H);
      g.fillStyle="#c8a24a"; g.fillRect(0,0,W,7);

      // 今日之牌
      g.save();
      if(!L.up){ g.translate(PAD+CW/2, CY+CH/2); g.rotate(Math.PI); g.translate(-(PAD+CW/2), -(CY+CH/2)); }
      g.drawImage(imDay, PAD, CY, CW, CH);
      g.restore();

      const tx=PAD+CW+52;
      g.fillStyle="#e8cd8a"; g.font=F(sans,28,"600");
      g.fillText(L.up?t.up.toUpperCase():t.rev.toUpperCase(), tx, CY+44);
      g.fillStyle="#e9e7e0"; g.font=F(serif, LANG==="zh"?72:58,"600");
      g.fillText(L.card, tx, CY+126);
      if(LANG==="zh"){ g.fillStyle="#9aa0b8"; g.font=F(sans,24,"400"); g.fillText(L.cardEn, tx, CY+164); }
      g.fillStyle="#9aa0b8"; g.font=F(sans,24,"400");
      g.fillText(LANG==="zh"
        ? L.sign+" · 第 "+L.decanNo+" 旬 · "+L.planet+" 守护"
        : L.sign+" · decan "+L.decanNo+" · ruled by "+L.planet, tx, CY+(LANG==="zh"?210:206));
      g.fillText(LANG==="zh"
        ? L.suit+" · "+L.elem+" · "+L.phase
        : L.suit+" · "+L.elem+" · "+L.phase, tx, CY+(LANG==="zh"?246:242));
      g.fillStyle="#6f7690"; g.font=F(sans,21,"400");
      g.fillText(LANG==="zh"?"全世界同一张":"the same card for everyone", tx, CY+(LANG==="zh"?284:278));

      // 你的本命旬位
      g.drawImage(imBirth, PAD, STRIP_Y, MINI_W, MINI_H);
      const bx=PAD+MINI_W+22;
      g.fillStyle="#c8a24a"; g.font=F(sans,21,"700");
      g.fillText(t.yours.toUpperCase(), bx, STRIP_Y+26);
      g.fillStyle="#e9e7e0"; g.font=F(serif,30,"600");
      g.fillText(L.bCard, bx, STRIP_Y+68);
      g.fillStyle="#9aa0b8"; g.font=F(sans,21,"400");
      g.fillText(LANG==="zh"
        ? L.bSign+" · 第 "+L.bDecanNo+" 旬 · "+L.bPlanet+" 守护 · "+L.bSuit
        : L.bSign+" · decan "+L.bDecanNo+" · ruled by "+L.bPlanet+" · "+L.bSuit, bx, STRIP_Y+96);
      g.fillStyle="#2a3050"; g.fillRect(PAD, STRIP_Y+MINI_H+22, W-PAD*2, 1);

      // 四段解读 + 碰面
      let y=BLOCK_Y0;
      for(let i=0;i<blocks.length;i++){
        const fs=Math.round(29*S), lh=Math.round(fs*1.42);
        g.fillStyle="#c8a24a"; g.font=F(sans, Math.round(22*S),"700");
        g.fillText(blocks[i][0], PAD, y); y+=Math.round(36*S);
        g.fillStyle="#dcd8cc"; g.font=F(sans, fs, "400");
        y=wrapText(g, blocks[i][1], PAD, y, W-PAD*2, lh, true)+Math.round(18*S);
      }

      // 页脚
      g.fillStyle="#2a3050"; g.fillRect(PAD, H-104, W-PAD*2, 1);
      g.fillStyle="#9aa0b8"; g.font=F(sans,22,"400");
      g.fillText("sarah-veil.github.io/daily-decan", PAD, H-60);
      g.textAlign="right"; g.fillText(todayISO(), W-PAD, H-60); g.textAlign="left";

      cv.toBlob(function(b){ b?resolve(b):reject(new Error("toBlob failed")); }, "image/png");
    };

    Promise.all([ svgImage($("sig").innerHTML), svgImage($("sig2").innerHTML) ])
      .then(function(ims){ paint(ims[0], ims[1]); }, reject);
  });
}

async function shareImage(){
  const t=T[LANG];
  let blob;
  try{ blob=await renderCardBlob(); }
  catch(e){ toast("✗ "+e.message); return; }
  const name="daily-decan-"+todayISO()+".png";

  // 触屏设备优先弹系统分享面板；桌面端一律直接下载，
  // 避免 canShare 为真但 share() 迟迟不落地、用户以为按钮坏了
  const touch = window.matchMedia && window.matchMedia("(pointer:coarse)").matches;
  if(touch && navigator.canShare){
    try{
      const file=new File([blob], name, {type:"image/png"});
      if(navigator.canShare({files:[file]})){
        await navigator.share({ files:[file], title:"The Daily Decan · 每日旬星" });
        return;
      }
    }catch(err){ if(err && err.name==="AbortError") return; }
  }

  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  toast(t.toast);
}
