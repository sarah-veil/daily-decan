name: 推送前敏感信息扫描

# 每次推送和 PR 都扫一遍全历史，防止令牌/密钥被写进仓库
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 全历史，不然只扫得到最后一次提交

      - name: 扫描全历史与工作区
        run: |
          # GitHub 默认用 bash -e 跑脚本；扫描阶段靠 grep 的退出码判断，
          # 必须把 -e 关掉，否则「没匹配到」会被当成「脚本出错」直接杀掉。
          set -uo pipefail
          set +e
          
          PATTERNS=(
            'gho_[A-Za-z0-9]{36}'
            'ghp_[A-Za-z0-9]{36}'
            'ghu_[A-Za-z0-9]{36}'
            'ghs_[A-Za-z0-9]{36}'
            'github_pat_[A-Za-z0-9_]{22,}'
            'sk-ant-[A-Za-z0-9_-]{20,}'
            'sk-[A-Za-z0-9]{32,}'
            'AKIA[0-9A-Z]{16}'
            'ASIA[0-9A-Z]{16}'
            'AIza[0-9A-Za-z_-]{35}'
            'xox[baprs]-[A-Za-z0-9-]{10,}'
            'LTAI[A-Za-z0-9]{12,}'
            'AKID[A-Za-z0-9]{13,}'
            '-----BEGIN [A-Z ]*PRIVATE KEY-----'
            'x-access-token:[^@[:space:]]+@github\.com'
            'glpat-[A-Za-z0-9_-]{20,}'
          )
          
          NOISE='example|placeholder|your[_-]?key|xxx+|<[^>]+>|REDACTED|CHANGEME|dummy|sample|A-Za-z0-9|\[A-Z'
          
          HITS=""
          for P in "${PATTERNS[@]}"; do
            OUT=$(git log --all -p 2>/dev/null | grep -InE "$P" 2>/dev/null | grep -viE "$NOISE" | head -5)
            if [ -n "$OUT" ]; then
              HITS="${HITS}【形态 $P】"$'\n'"${OUT}"$'\n'
            fi
          done
          
          GENERIC='(password|passwd|secret|api[_-]?key|access[_-]?token|auth[_-]?token|private[_-]?key)[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']{12,}["'"'"']'
          OUT=$(git log --all -p 2>/dev/null | grep -InE "$GENERIC" 2>/dev/null | grep -viE "$NOISE" | head -8)
          if [ -n "$OUT" ]; then
            HITS="${HITS}【赋值形态】"$'\n'"${OUT}"$'\n'
          fi
          
          OUT=$(grep -rInE "${PATTERNS[0]}|${PATTERNS[5]}|${PATTERNS[6]}|${PATTERNS[7]}" \
                --exclude-dir=.git . 2>/dev/null | grep -viE "$NOISE" | head -5)
          if [ -n "$OUT" ]; then
            HITS="${HITS}【工作区】"$'\n'"${OUT}"$'\n'
          fi
          
          NCOMMIT=$(git rev-list --all --count 2>/dev/null)
          if [ -n "$HITS" ]; then
            {
              echo "### ❌ 扫到疑似敏感信息"
              echo ""
              echo '```'
              echo "$HITS" | head -40 | sed -E 's/(gh[opusr]_|github_pat_|sk-|AKIA|AIza|xox[baprs]-)[A-Za-z0-9_-]+/\1<已隐去>/g'
              echo '```'
              echo ""
              echo "**别在这里贴原文，也别开公开 issue** —— 这是公开流水线，贴出来等于二次泄露。"
              echo "去仓库 Settings → Secrets 处理，本地改写历史后再强推。"
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "::error::扫到疑似敏感信息，详见本次运行的 Summary"
            exit 1
          fi
          
          {
            echo "### ✅ 没扫到令牌或密钥"
            echo ""
            echo "扫描了全部 **${NCOMMIT}** 个提交的完整历史，加上工作区。"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "✅ 干净：${NCOMMIT} 个提交全历史扫描通过"
